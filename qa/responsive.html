<!doctype html><html lang="en"><meta charset="utf-8"><title>Invitation layout checks</title>
<style>body{font:16px sans-serif;background:#e5e7eb;margin:0}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px}iframe{border:0;background:white;display:block;margin:0 auto;height:844px}main{overflow:auto;padding-bottom:10px}</style>
<header><span>Viewport:</span><button data-width="320">320</button><button data-width="390">390</button><button data-width="430">430</button><button data-width="768">768</button><button data-width="1024">1024</button><button id="restart">Restart</button><button id="rsvp-test">RSVP test</button><button id="admin-test">Dashboard test</button><button id="reduced">Reduced motion</button><span id="size">390 × 844</span></header>
<main><iframe title="Wedding preview" src="/" width="390" height="844"></iframe></main>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{frame.width=button.dataset.width;document.querySelector('#size').textContent=button.dataset.width+' × 844'});document.querySelector('#restart').onclick=()=>frame.src='/';document.querySelector('#rsvp-test').onclick=()=>frame.src='/qa/rsvp.html';document.querySelector('#admin-test').onclick=()=>frame.src='/qa/admin.html';document.querySelector('#reduced').onclick=()=>frame.src='/qa/reduced.html';</script></html>
