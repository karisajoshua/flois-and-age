<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard local test</title>
<style>.qa-banner{position:fixed;top:0;left:0;right:0;z-index:100;background:#552719;color:white;font:14px sans-serif;padding:8px;text-align:center}</style>
<div class="qa-banner">Local test database only <button id="demo-open">Open demonstration dashboard</button></div><div id="root"></div>
<script>const realFetch=window.fetch.bind(window);window.fetch=(input,init={})=>{if(typeof input==='string'&&input.startsWith('/api/')){const headers=new Headers(init.headers);headers.set('x-rsvp-qa','1');return realFetch(input,{...init,headers})}return realFetch(input,init)};</script>
<script>document.getElementById("demo-open").onclick=async()=>{await fetch("/api/qa-session",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});location.reload()};</script>
<script type="module" src="/src/main.tsx"></script></html>
